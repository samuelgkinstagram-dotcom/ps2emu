name: Build PS2 Emulator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # permite rodar manualmente pelo site do GitHub

jobs:
  build-windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias (SDL2 + zlib)
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          vcpkg install sdl2:x64-windows zlib:x64-windows
        shell: powershell

      - name: Configurar CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: powershell

      - name: Compilar
        run: cmake --build build --config Release --parallel
        shell: powershell

      - name: Copiar DLLs necessarias
        run: |
          mkdir -p release
          cp build/Release/ps2emu.exe release/
          cp C:/vcpkg/installed/x64-windows/bin/SDL2.dll release/
          cp C:/vcpkg/installed/x64-windows/bin/zlib1.dll release/
          cp -r bios_placeholder release/bios
          cp -r saves_placeholder release/saves
          echo "Coloque sua BIOS aqui (SCPH-70012.bin)" > release/bios/LEIA_ME.txt
          echo "Saves de memcard ficam aqui" > release/saves/LEIA_ME.txt
        shell: powershell

      - name: Criar instalador NSIS
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer/setup.nsi

      - name: Upload EXE instalador
        uses: actions/upload-artifact@v4
        with:
          name: PS2Emu-Windows-Installer
          path: installer/PS2Emu_Setup.exe
          retention-days: 30

      - name: Upload pasta release (portavel)
        uses: actions/upload-artifact@v4
        with:
          name: PS2Emu-Windows-Portable
          path: release/
          retention-days: 30

  build-linux:
    name: Linux Binary
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libsdl2-dev zlib1g-dev

      - name: Compilar
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Upload binario Linux
        uses: actions/upload-artifact@v4
        with:
          name: PS2Emu-Linux
          path: build/ps2emu
          retention-days: 30

  release:
    name: Criar Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: PS2Emu-Windows-Installer
          path: dist/

      - name: Download artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: PS2Emu-Linux
          path: dist/

      - name: Criar GitHub Release automatico
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "PS2Emu Build #${{ github.run_number }}"
          body: |
            ## PS2 Emulator - Build Automatico

            ### Download
            - **Windows**: PS2Emu_Setup.exe (instalador completo)
            - **Linux**: ps2emu (binario)

            ### Requisitos Minimos
            - Windows 7/10/11 64-bit
            - 2 GB RAM
            - CPU: Celeron/Pentium (sem placa de video dedicada!)
            - 500 MB espaco livre

            ### Como usar
            1. Baixe PS2Emu_Setup.exe
            2. Instale normalmente
            3. Coloque sua BIOS em C:/PS2Emu/bios/
            4. Abra uma ISO/BIN de PS2
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
